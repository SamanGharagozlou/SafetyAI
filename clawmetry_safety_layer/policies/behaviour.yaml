# Behaviour policy: what is normal and what is forbidden for the robot.
#
# Enforced locally in skills/skills.py (same places the zone policy is enforced), by the command gate's predictor
# before every actuator command (bridge/predictor.py), and by the continuous monitor in the skills API
# (skills/monitor.py, every 200 ms). Editable at runtime with GET/PUT /policy on the skills API (validated; every
# change is logged as a policy.changed trace event with who/when). Zone geometry and the restricted / camera_off
# flags stay in zones_file; this file holds the behaviour numbers.
name: leukerbad-spa-default
version: 1
zones_file: policies/zones.yaml

zones:                        # per-zone walking speed caps (m/s); every zone in zones_file must be listed
  A: {speed_cap: 0.4}
  corridor: {speed_cap: 0.3}
  B: {speed_cap: 0.3}
  C: {speed_cap: 0.2}
near_person_speed_cap: 0.2    # applied when the body reports a person nearby (bridge.near_person(); none do yet)

allowed_objects: [tray, towels]
place_targets: [table_B, shelf_corridor, table_A]

skills:                       # bounds per skill call: wall time (s) and walked path length (m)
  get_state: {max_duration_s: 5}
  navigate_to: {max_duration_s: 20, max_path_m: 8.0}
  pick: {max_duration_s: 20, max_path_m: 2.0}
  place: {max_duration_s: 20, max_path_m: 2.0}
  say: {max_duration_s: 10}
  look_at: {max_duration_s: 5}
  hold_pose: {max_duration_s: 5}
max_retries: 2                # a skill that failed (not blocked) this many times in a row with the same args is refused

forbidden:
  enter_restricted_zones: true        # zones with restricted: true in zones_file
  enter_camera_off_zones: true        # zones with camera_off: true in zones_file
  max_hold_height_m: 1.2              # never carry anything with the grasp site above this height
  max_speed_while_holding_mps: 0.3    # never walk faster than this while holding something
  max_tilt_deg: 15.0                  # monitor: body tilt beyond this (bodies that report tilt) is a hard breach

monitor:
  period_s: 0.2
  soft_speed_margin: 0.10     # speed > cap * (1 + soft) -> breach event (soft)
  hard_speed_margin: 0.50     # speed > cap * (1 + hard) -> breach event (hard) + stop_and_settle

prediction:
  horizon_s: 3.0
  dt_s: 0.1

quiet_hours:                  # local time; off by default so demos and tests behave the same at any hour
  enabled: false
  start: "22:00"
  end: "07:00"
  forbid_skills: [say]
  speed_cap: 0.2
