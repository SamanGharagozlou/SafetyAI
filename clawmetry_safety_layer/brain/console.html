<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Control</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#2b313a;--fg:#e6e6e6;--mut:#8b949e;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{font-size:16px}.pill{padding:3px 10px;border-radius:99px;font-weight:600;background:#222}
main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;padding:12px 16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 8px}
svg{width:100%;height:auto;background:#0b0e13;border-radius:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}.kv span:nth-child(odd){color:var(--mut)}
button,select,input{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:#21262d;color:var(--fg)}
button:hover{border-color:var(--acc)}button.stop{background:#3d1214;border-color:var(--bad)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}#log{height:220px;overflow:auto;font:12px ui-monospace,monospace;white-space:pre-wrap}
.v{border-left:3px solid var(--line);padding:4px 8px;margin:4px 0}.v.hold{border-color:var(--bad)}.v.caution{border-color:var(--warn)}
</style>
</head>
<body>
<header>
  <b>D1 Ultra-W · Leukerbad Therme</b>
  <span>FSM <span id="fsm" class="pill">?</span></span>
  <span>people &lt;2 m <b id="ppl">–</b></span>
  <span>link RTT <b id="rtt">–</b></span>
  <span>brain <b id="brainok">–</b> · ClawMetry <b id="cpok">–</b></span>
  <a id="cm" href="#" target="_blank" style="color:var(--acc)">ClawMetry session</a>
</header>
<main>
  <section>
    <h2>Zones and pose</h2>
    <svg id="map" viewBox="0 0 100 60"></svg>
    <div class="kv" id="robot" style="margin-top:8px"></div>
  </section>
  <section>
    <h2>Safety</h2>
    <div class="kv" id="safety"></div>
    <div class="row">
      <button onclick="act('pause',{reason:'mission control'})">Pause</button>
      <button onclick="act('resume',{})">Resume</button>
      <button onclick="act('reset',{})">Reset (recover)</button>
      <button onclick="act('approve',{})">Approve</button>
      <button onclick="act('deny',{})">Deny</button>
      <button onclick="act('confirm',{})">Confirm load / hand-off</button>
    </div>
    <h2>Goals (no velocity: goals only)</h2>
    <div class="row">
      <select id="poi"></select><button onclick="act('guide_to',{poi:poi.value})">Guide to</button>
    </div>
    <div class="row"><input id="say" placeholder="Say…" style="flex:1"><button onclick="act('say',{text:say.value})">Say</button></div>
    <div class="row"><input id="ask" placeholder="Ask the concierge as a guest…" style="flex:1"><button onclick="act('ask',{text:ask.value})">Ask</button></div>
    <div id="actlog" style="color:#8b949e;min-height:1.4em"></div>
    <h2>Last verdicts (Cosmos)</h2>
    <div id="verdicts"></div>
  </section>
  <section style="grid-column:1/-1">
    <h2>Events</h2>
    <div id="log"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let Z = null, last = null;
const COLORS = {NORMAL:'#3fb950', CAUTION:'#d29922', HOLD:'#f85149', RECOVER:'#a371f7'};
function log(s){ $('actlog').textContent = new Date().toLocaleTimeString()+'  '+s; }
async function act(name, body){
  const r = await fetch('/api/edge/'+name, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  log(name+' -> '+r.status+' '+(j.message||j.reply||j.detail||JSON.stringify(j).slice(0,200)));
}
function bbox(){ let xs=[],ys=[]; for(const z of Object.values(Z.zones)) for(const [x,y] of z.polygon){xs.push(x);ys.push(y);} return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]; }
function drawMap(s){
  if(!Z) return; const [x0,y0,x1,y1]=bbox(); const W=100, H=60, sc=Math.min(W/(x1-x0+1),H/(y1-y0+1));
  const tx=(x)=>(x-x0+0.5)*sc, ty=(y)=>H-(y-y0+0.5)*sc;
  let g='';
  for(const [n,z] of Object.entries(Z.zones)){
    const bad = z.restricted || z.camera_off;
    g+=`<polygon points="${z.polygon.map(([x,y])=>tx(x)+','+ty(y)).join(' ')}" fill="${bad?'#3d1214':'#14301b'}" stroke="#2b313a" stroke-width=".3"/>`;
    const [cx,cy]=z.centre||z.polygon[0]; g+=`<text x="${tx(cx)}" y="${ty(cy)}" font-size="2" fill="#8b949e" text-anchor="middle">${n}</text>`;
  }
  for(const [n,l] of Object.entries(Z.landmarks||{})) g+=`<circle cx="${tx(l.xy[0])}" cy="${ty(l.xy[1])}" r=".7" fill="#58a6ff"><title>${n}</title></circle>`;
  if(s){ const r=s.robot, a=r.yaw; const px=tx(r.x), py=ty(r.y);
    g+=`<circle cx="${px}" cy="${py}" r="1.4" fill="${COLORS[s.safety.state]||'#fff'}"/><line x1="${px}" y1="${py}" x2="${px+3*Math.cos(a)}" y2="${py-3*Math.sin(a)}" stroke="#fff" stroke-width=".4"/>`; }
  $('map').innerHTML=g;
}
function kv(el, obj){ el.innerHTML = Object.entries(obj).map(([k,v])=>`<span>${k}</span><span>${typeof v==='object'?JSON.stringify(v):v}</span>`).join(''); }
async function poll(){
  try{
    const r = await fetch('/api/edge/state'); const s = await r.json();
    if(!r.ok){ $('fsm').textContent='EDGE ?'; $('fsm').style.background='#555'; log('edge: '+(s.detail||r.status)); return; }
    last = s; const f=s.safety;
    $('fsm').textContent=f.state; $('fsm').style.background=COLORS[f.state]||'#555';
    $('ppl').textContent=s.observation.people_within_2m ?? '–';
    $('rtt').textContent=(s._rtt_s!=null? Math.round(s._rtt_s*1000)+' ms':'–');
    $('brainok').textContent=s.link.brain_ok===false?'DOWN':(s.link.brain_ok?'ok':'?');
    $('cpok').textContent=s.link.control_plane_ok===false?'DOWN':(s.link.control_plane_ok?'ok':'?');
    if(s.clawmetry && s.clawmetry.dashboard){ $('cm').href=s.clawmetry.dashboard; $('cm').title=s.clawmetry.run_id||''; }
    const rb=s.robot; kv($('robot'),{zone:rb.zone, pose:`${rb.x.toFixed(2)}, ${rb.y.toFixed(2)}, ${rb.yaw.toFixed(2)}`, mode:rb.mode, battery:rb.battery_pct+' %', transport:s.transport.transport, connected:s.transport.connected, scene:s.observation.scene, nearest_person_m:s.observation.nearest_person_m, degraded:(s.observation.degraded||[]).join(', ')||'–'});
    kv($('safety'),{state:f.state, speed_cap:f.speed_cap==null?'policy':f.speed_cap+' m/s', latched:f.latched?f.latched.source+': '+f.latched.reason:'–', awaiting_approval:f.awaiting_approval, causes:f.causes.map(c=>c.source+' '+c.level+': '+c.reason).join(' | ')||'–', judge_unavailable:f.judge_unavailable});
    const vs=(s.verdicts||[]).slice().reverse();
    $('verdicts').innerHTML=vs.map(v=>`<div class="v ${v.leaves_go_zone||(v.stop&&v.hazards&&v.hazards.length)?'hold':(v.stop||(v.hazards||[]).length?'caution':'')}">${v.judge_unavailable?'judge unavailable: '+v.error:`stop=${v.stop} leaves=${v.leaves_go_zone} people=${v.people_within_2m} ${(v.hazards||[]).join(', ')} · ${v.reason||''}`} <span style="color:#8b949e">${v.latency_s??''} s ${v.trigger||''}</span></div>`).join('')||'–';
    drawMap(s);
    $('log').textContent = (s.events||[]).slice().reverse().map(e=>new Date(e.ts*1000).toLocaleTimeString()+'  '+e.kind+'  '+JSON.stringify(Object.fromEntries(Object.entries(e).filter(([k])=>!['ts','kind','controller_id'].includes(k)))).slice(0,220)).join('\n');
  }catch(e){ log('poll failed: '+e); }
}
(async()=>{
  Z = await (await fetch('/api/zones')).json();
  $('poi').innerHTML = Object.entries(Z.zones).filter(([n,z])=>!z.restricted).map(([n])=>`<option>${n}</option>`).join('') + '<option disabled>──</option>' + Object.entries(Z.zones).filter(([n,z])=>z.restricted).map(([n])=>`<option>${n}</option>`).join('');
  try{ const pois = await (await fetch('/pois')).json(); if(pois.length) $('poi').innerHTML = pois.map(p=>`<option value="${p.id}">${p.name}${p.no_go?' (no-go)':''}</option>`).join(''); }catch(e){}
  poll(); setInterval(poll, 1000);
})();
</script>
</body>
</html>
