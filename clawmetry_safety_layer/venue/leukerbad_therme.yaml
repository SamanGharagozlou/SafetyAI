  pool_bar:
    zone: pool_deck
    names: {en: Pool Bar, de: Pool-Bar, fr: bar de la piscine, it: bar della piscina}
    no_go: {en: "the Pool Bar is at the Indoor Pool, behind the turnstiles", de: "die Pool-Bar ist beim Hallenbad hinter den Drehkreuzen", fr: "le bar est à la piscine couverte, derrière les tourniquets", it: "il bar è alla piscina coperta, oltre i tornelli"}
    nearest: bath_entrance
  massage_beauty:
    zone: pool_deck
    names: {en: Massage & Beauty, de: Massage & Beauty, fr: Massage & Beauté, it: Massaggi & Bellezza}
