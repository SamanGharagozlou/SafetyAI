    names: {en: Sauna World, de: Saunawelt, fr: monde des saunas, it: mondo delle saune}
    no_go: {en: "the Sauna World is behind the turnstiles and textile-free", de: "die Saunawelt ist hinter den Drehkreuzen und textilfrei", fr: "le monde des saunas est derrière les tourniquets et sans textile", it: "il mondo delle saune è oltre i tornelli ed è senza costume"}
