    names: {en: Relax level, de: Relax-Ebene, fr: niveau Relax, it: livello Relax}
    no_go: {en: "the Relax level is a barefoot zone, so I keep my wheels out of it", de: "die Relax-Ebene ist eine Barfusszone, da fahre ich nicht hinein", fr: "le niveau Relax est une zone pieds nus, je n'y entre pas", it: "il livello Relax è una zona a piedi nudi, non ci entro"}
