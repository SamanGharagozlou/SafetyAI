    names: {en: concourse, de: Halle, fr: hall, it: atrio}
  lost_property:
    zone: reception
    names: {en: lost property (at reception), de: Fundbüro (Kasse), fr: objets trouvés (caisse), it: oggetti smarriti (cassa)}
  pool_deck:
    zone: pool_deck
    names: {en: pools, de: Becken, fr: bassins, it: piscine}
    no_go: {en: "the pool deck is wet and guests there are in swimwear, so I don't go past the turnstiles", de: "der Beckenbereich ist nass und dort sind Gäste in Badekleidung, deshalb fahre ich nicht hinter die Drehkreuze", fr: "le bord des bassins est mouillé et les clients y sont en maillot, donc je ne passe pas les tourniquets", it: "il bordo vasca è bagnato e gli ospiti sono in costume, quindi non oltrepasso i tornelli"}
