# Leukerbad Therme: facts for the concierge (given by the team 2026-11-14, NOT scraped) + points of interest mapped to
# the zones in policies/zones_therme.yaml. venue/refresh.py writes live open/closed into venue/live.json; these static
# hours stay the fallback. Every POI the robot may not enter has a no_go reason and a nearest allowed alternative.
venue:
  name: Leukerbad Therme
  address: Thermenstrasse 56, CH-3954 Leukerbad
  phone: "+41 27 472 20 20"
  email: info@leukerbad.ch
  web: https://www.leukerbad.ch/en/therme
  coordinates: {lat: 46.37762, lon: 7.62537}
  altitude_m: 1411
  claims: ["largest thermal bath in Europe", "thermal water up to 51 °C", "the water spends about 40 years underground"]

hours:
  - {areas: [Vitality Pool, Fun Bath, Adventure Pool, Relax Pool, Sports Pool, Grotto, Tread Bath, Indoor Pool, Kids Basin], days: daily, open: "08:00", close: "20:00"}
  - {areas: [Sauna World, Waterslides, Kids Paradise], days: daily, open: "10:00", close: "19:00"}
  - {areas: [Massage & Beauty], days: daily, open: "10:00", close: "18:00", phone: "+41 27 472 20 32"}
  - {areas: [Aqualis Hair Studio], days: Mon-Fri, open: "08:30", close: "18:30", phone: "+41 27 470 12 13"}
  - {areas: [Aqualis Hair Studio], days: Sat, open: "08:30", close: "17:00", phone: "+41 27 470 12 13"}

temperatures_c:
  Vitality Pool: 36
  Fun Bath: 36
  Adventure Pool: 35
  Indoor Pool: 35
  Children's Pool: 35
  Kids' Paradise (to age 4): 36
  Relax Pool: 36
  Tread Bath: 41
  Grotto: 44
  Sports Pool: 28
  Waterslides: 28
extras: ["beach-volleyball sand court 11 x 16 m next to the Sports Pool"]

prices_chf:
  thermal_bath_3h: {adult_16plus: 33, child_6plus: 20}
  thermal_bath_1day: {adult_16plus: 39, child_6plus: 23}
  sauna_without_bath_adult: 25
  family_2_adults_2_children: {"3h": 95, "1day": 112}
  five_entries_3h: {adult: 157, child: 95, note: "valid 1 year, non-transferable"}
  under_6: {price: 0, note: "free, ID required"}
  sauna_and_steam_surcharge_16plus: 15
  rentals: {swimsuit: 8, towel: 5, bathrobe: 12}
  discounts:
    - "Leukerbad Guest Card: up to 15 % off (not on the sauna)"
    - "Magic Pass: bathing area only, max 3 h from the turnstile, surcharge after that"
  nearby: ["Walliser Alpentherme & Spa from CHF 33", "Summer Card from CHF 53"]

rules:
  - "The Sauna World is textile-free and for ages 16 and over."
  - "No photography or video anywhere in the complex."
  - "No animals; service dogs must be registered in advance."
  - "School groups register at reception and stay supervised."
  - "Pool Bar: drinks only in the bar area or in the water, no glass, alcohol in moderation, follow the staff."
  - "Lost property is kept for one month at reception."

facilities:
  - "Sauna World: saunas and steam baths named after mountains, with a view of the Daubenhorn."
  - "Massage & Beauty: massages, naturopathy (Fontisana), cosmetics, manicure and pedicure, facials."
  - "Pool Bar at the Indoor Pool."
  - "Souvenir shop and café on the level-4 concourse."
  - "Ticket desk (Kasse) on level 4."

floors:
  "4": "Therme / Relax entrance and the Kasse (ticket desk)"
  "3": "Relax (barefoot zone)"
  "2": "Technik: Kein Eingang / No Entry"
  "1": "Technik: Kein Eingang / No Entry"
  "0": "Parking (Kasse Parking)"

# Points of interest. zone = where the robot stops (policies/zones_therme.yaml). no_go = the robot never goes there;
# the concierge offers `nearest` instead. requires_approval = ClawMetry Approve/Deny decides whether STAFF escort the
# guest (the robot never enters either way).
pois:
  kasse:
    zone: reception
    names: {en: ticket desk (Kasse), de: Kasse, fr: caisse, it: cassa}
    intro: {en: "This way to the ticket desk.", de: "Hier entlang zur Kasse.", fr: "Par ici pour la caisse.", it: "Da questa parte per la cassa."}
  shop:
    zone: shop_cafe
    names: {en: souvenir shop, de: Souvenirshop, fr: boutique de souvenirs, it: negozio di souvenir}
  cafe:
    zone: shop_cafe
    names: {en: café, de: Café, fr: café, it: caffè}
  bath_entrance:
    zone: bath_entrance
    names: {en: Therme entrance, de: Eingang Therme, fr: entrée des thermes, it: ingresso delle terme}
    intro: {en: "Follow me to the Therme entrance.", de: "Folgen Sie mir zum Eingang der Therme.", fr: "Suivez-moi jusqu'à l'entrée des thermes.", it: "Mi segua fino all'ingresso delle terme."}
    arrival: {en: "Here is the entrance. The turnstiles are just ahead; enjoy the water!", de: "Hier ist der Eingang. Die Drehkreuze sind gleich vorne. Viel Vergnügen!", fr: "Voici l'entrée. Les tourniquets sont juste devant. Bon bain !", it: "Ecco l'ingresso. I tornelli sono proprio davanti. Buon bagno!"}
