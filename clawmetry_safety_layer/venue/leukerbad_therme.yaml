  technik:
    zone: technik
    names: {en: Technik (staff only), de: Technik, fr: technique, it: tecnica}
    no_go: {en: "Technik is staff only", de: "Technik ist nur für Personal", fr: "la technique est réservée au personnel", it: "la tecnica è riservata al personale"}
