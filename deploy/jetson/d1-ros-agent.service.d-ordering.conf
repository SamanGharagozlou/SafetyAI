# Drop-in for the EXISTING d1-ros-agent.service. Install as:
#   /etc/systemd/system/d1-ros-agent.service.d/ordering.conf
#
# Does not replace that unit - only adds ordering. The agent itself is already
# correct and already survives reboot.
#
# WHY THIS EXISTS: the agent and the bridge have a DDS matching-order bug. If
# the agent starts FIRST, its subscriptions match (count_publishers reports 1)
# but the callbacks NEVER FIRE. QoS is identical on both ends, so it is not a
# QoS mismatch. Measured: restarting the AGENT does not fix it; restarting the
# BRIDGE while the agent is live fixes it instantly.
#
# So the ordering below is necessary but NOT sufficient on its own - systemd
# considers the bridge "started" the moment the process execs, which is well
# before it is actually publishing. d1-bridge-watchdog.timer closes that gap by
# restarting the BRIDGE (never the agent) whenever the link is dead.

[Unit]
After=d1-bridge.service
Wants=d1-bridge.service
