# Local costmap for the D1, fed by the monocular depth cloud (/camera/points from d1_depth).
# NOTE: the standalone nav2_costmap_2d executable hard-codes the node name /costmap/costmap (not /local_costmap/...).
# Floor is z = 0 in the `odom` frame (the bridge publishes the SDK body height in odom->base_link).
costmap:
  costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5      # camera frames are stamped at PC receive time; TF arrives at ~10 Hz
      rolling_window: true
      always_send_full_costmap: true   # otherwise only the first grid + incremental /costmap_updates are published
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.315, 0.18], [0.315, -0.18], [-0.315, -0.18], [-0.315, 0.18]]"   # ~0.63 x 0.36 m standing body
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.6
        mark_threshold: 0
        observation_sources: depth_cloud
        depth_cloud:
          topic: /camera/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.10   # ignore floor noise
          max_obstacle_height: 0.5    # robot is 0.42 m tall; ignore ceilings/beams
          obstacle_min_range: 0.2
          obstacle_max_range: 3.0     # the monocular model is unreliable beyond ~3 m (docs/costmap_plan.md)
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
