# Wheel odometry + IMU fusion (robot_localization). Topics match agibot_d1_bridge (/odom, /imu).
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true          # publishes odom->base_link. Set false if the D1 driver already does.
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /odom              # nav_msgs/Odometry from the wheels
    odom0_config: [false, false, false,  false, false, false,
                   true,  true,  false,  false, false, true,
                   false, false, false]
    imu0: /imu                # sensor_msgs/Imu
    imu0_config: [false, false, false,  false, false, true,
                  false, false, false,  false, false, true,
                  false, false, false]
    imu0_remove_gravitational_acceleration: true
