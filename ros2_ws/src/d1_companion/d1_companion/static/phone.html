<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robot companion</title>
<link rel="stylesheet" href="/phone.css">
</head>
<body>
<header class="top">
  <div class="brand"><span aria-hidden="true">&#129302;</span> <span id="robotName">Robot companion</span></div>
  <span id="chip" class="chip">connecting&hellip;</span>
</header>
<main>
  <section id="joinCard" class="card">
    <h1>Meet your robot companion</h1>
    <p id="joinMsg">Connecting to the robot&hellip;</p>
    <label for="nick" class="sr">Nickname</label>
    <input id="nick" type="text" maxlength="24" placeholder="Nickname (optional)" autocomplete="off">
    <button id="joinBtn" class="primary" disabled>Start</button>
  </section>

  <section id="app" hidden>
    <div id="chat" class="chat" aria-live="polite"></div>

    <div class="card map">
      <canvas id="map" aria-label="Map with the places the robot can take you to"></canvas>
      <div class="legend">
        <span><i class="dot place"></i> place</span>
        <span><i class="dot target"></i> heading there</span>
        <span><i class="dot here"></i> robot is here</span>
        <span><i class="arrow"></i> robot</span>
      </div>
    </div>

    <div id="progress" class="progress" hidden>
      <div class="bar"><div id="barFill"></div></div>
      <div id="progressText"></div>
    </div>

    <div id="goBar" class="gobar" hidden>
      <span id="goLabel"></span>
      <button id="goBtn" class="primary">Take me there</button>
      <button id="goCancel" class="ghost">Cancel</button>
    </div>

    <h2>Places</h2>
    <div id="places" class="chips"></div>

    <form id="chatForm" class="row">
      <label for="msg" class="sr">Message</label>
      <input id="msg" type="text" maxlength="500" placeholder="Ask, or say where to go&hellip;" autocomplete="off">
      <button type="button" id="mic" class="ghost" aria-label="Speak" hidden>&#127908;</button>
      <button type="submit" class="primary">Send</button>
    </form>
    <div class="row actions">
      <button id="stop" class="danger" hidden>Stop</button>
      <button id="finish" class="ghost">Finish</button>
      <label class="speak"><input id="speak" type="checkbox"> Read answers aloud</label>
    </div>
  </section>

  <section id="ended" class="card" hidden>
    <h1>Thank you!</h1>
    <p id="endedMsg"></p>
    <p class="hint">Scan the code on the robot again to start a new session.</p>
  </section>
</main>
<script src="/phone.js"></script>
</body>
</html>
