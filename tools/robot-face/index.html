<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Tropfi</title>
<!--
  THE ROBOT'S FACE AND THE ROBOT'S HEAD.

  This runs full-screen on the phone strapped to the D1. It is the whole
  robot as far as a guest is concerned, and it owns everything to do with
  the conversation:

    the QR code while nobody is talking to it
    the face, lip-synced, while it talks
    the microphone
    the loudspeaker
    the Vapi call itself

  ONE DEVICE, ONE MICROPHONE - like any humanoid robot. You talk to the dog,
  not into your own phone. The guest's phone only carries consent and a Stop
  button; it has no audio role at all.

  WHY THAT IS ALSO THE TECHNICALLY CORRECT CHOICE, not just the nicer one:

  1. Echo. Mic and speaker on the same device is the exact case browser echo
     cancellation is built for. Split them - phone mic, Bluetooth speaker -
     and the speaker's 100-200 ms latency puts the echo outside what AEC can
     cancel, so the assistant hears itself, transcribes itself, and
     interrupts itself mid-sentence.
  2. Lip sync. Humans notice about 45 ms of audio-visual offset. The mouth
     here is read off the very audio being played, on the same device, so
     there is no network in the loop to lose that race.

  THE COST, and it is not negotiable: this page holds the microphone, so it
  can NOT also drive a Bluetooth speaker. Measured here on both iPhone and
  Android - getUserMedia drops the phone from A2DP to HFP, and most Bluetooth
  speakers have no usable HFP, so the sound falls back to the phone's own
  speaker. If the phone is not loud enough for the room, the speaker is
  plugged in WITH A CABLE. There is no Bluetooth anywhere in this design.

  SERVE THIS OVER HTTPS. A browser will not give the microphone to an
  http:// page on a LAN address - it is not a secure context - and the
  failure looks like a permissions bug rather than a protocol one.

  MODES
  ?demo=1   synthetic speech envelope, no network, no mic. For judging the face.
  ?qr=<url> override what the idle QR encodes.
-->
<style>
  :root {
    --deep:   #04243a;   /* thermal water at depth */
    --mid:    #0a4f78;
    --bright: #19a7d4;   /* the pool lit from below */
    --pale:   #8fe3f7;
    --ink:    #04202f;
    --white:  #f2fbff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--deep);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    color: var(--white); user-select: none;
  }
  /* Behind everything, breathing. A perfectly still screen reads as crashed. */
  #glow {
    position: fixed; inset: -30%; z-index: 0;
    background: radial-gradient(circle at 50% 55%, #0d6490 0%, #063b5c 40%, var(--deep) 70%);
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.08); opacity: 1 } }

  .screen { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 1.5vmin; transition: opacity .4s; }
  .screen[hidden] { display: none; }

  /* ---------- arm ---------- */
  #arm { cursor: pointer; }
  #arm .tap { font-size: 7vmin; font-weight: 800; letter-spacing: -.02em; }
  #arm .why { font-size: 3vmin; color: var(--pale); max-width: 70vmin; text-align: center; margin-top: 3vmin; line-height: 1.5; }
  #arm .pulse { width: 26vmin; height: 26vmin; border-radius: 50%; margin-bottom: 6vmin;
                background: var(--bright); opacity: .25; animation: ping 1.8s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(.75); opacity: .45 } 100% { transform: scale(1.35); opacity: 0 } }

  /* ---------- idle ---------- */
  #idle .card { background: var(--white); border-radius: 6vmin; padding: 4vmin;
                box-shadow: 0 2vmin 6vmin rgba(0,0,0,.45); }
  #qr { width: 46vmin; height: 46vmin; display: grid; place-items: center; }
  #qr canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; }
  #qr-fallback { color: #04202f; font: 600 2.2vmin/1.5 ui-monospace, monospace; word-break: break-all;
                 text-align: center; padding: 2vmin; }
  #idle h1 { font-size: 5.6vmin; margin: 4vmin 0 1vmin; font-weight: 800; letter-spacing: -.02em; }
  #idle p  { font-size: 3.1vmin; margin: 0; color: var(--pale); text-align: center; max-width: 72vmin; }

  /* ---------- face ---------- */
  #face { width: min(104vmin, 99vw); height: auto; max-height: 90vh; overflow: visible; }
  #caption { position: fixed; left: 0; right: 0; bottom: 3vmin; z-index: 2; text-align: center;
             font-size: 3vmin; color: var(--pale); opacity: .85; padding: 0 6vmin; min-height: 4vmin; }
  #badge { position: fixed; top: 2.5vmin; left: 50%; transform: translateX(-50%); z-index: 3;
           font-size: 2.3vmin; letter-spacing: .18em; text-transform: uppercase; color: var(--pale); opacity: .5; }

  /* Faults are shown on the robot's own face. A failure only in a console is
     a failure nobody in the room can diagnose. */
  #fault { position: fixed; bottom: 0; left: 0; right: 0; z-index: 9; padding: 2.4vmin;
           background: #7d1d1d; color: #fff; font-size: 2.5vmin; text-align: center; display: none; }
</style>
</head>
<body>

<div id="glow"></div>

<!-- ARM. A browser will not hand a page the microphone, or play a sound,
     until somebody has tapped it. An unattended screen that was never tapped
     is silent and gives no clue why, so we make the tap the first screen
     instead of a mystery later. -->
<section class="screen" id="arm">
  <div class="pulse"></div>
  <div class="tap">Tap to wake me</div>
  <div class="why">One tap lets this screen use the microphone and the speaker. Do it once while setting up.</div>
</section>

<!-- IDLE -->
<section class="screen" id="idle" hidden>
  <div class="card"><div id="qr"><div id="qr-fallback">loading…</div></div></div>
  <h1>Scan to say hello</h1>
  <p>I am the greeter at Leukerbad Therme. Scan this, then just talk to me.</p>
</section>

<!-- LIVE -->
<section class="screen" id="live" hidden>
  <div id="badge"></div>
  <svg id="facesvg" viewBox="0 0 200 230" aria-hidden="true">
    <defs>
      <radialGradient id="body" cx="38%" cy="28%" r="78%">
        <stop offset="0%"  stop-color="#7fe0fb"/>
        <stop offset="48%" stop-color="var(--bright)"/>
        <stop offset="100%" stop-color="#0a5f90"/>
      </radialGradient>
      <radialGradient id="shine" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".92"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="2.4"/></filter>
    </defs>
    <g id="drop">
      <path d="M100 8 C100 8 172 92 172 138 A72 72 0 1 1 28 138 C28 92 100 8 100 8 Z" fill="url(#body)"/>
      <!-- a drop with no specular read looks like a balloon -->
      <ellipse cx="68" cy="92" rx="26" ry="34" fill="url(#shine)" opacity=".55" transform="rotate(-20 68 92)"/>
      <g id="features">
        <g id="eyeL">
          <ellipse class="sclera" cx="72" cy="132" rx="19" ry="22" fill="var(--white)"/>
          <circle  class="pupil"  cx="72" cy="134" r="9.5" fill="var(--ink)"/>
          <circle  class="spark"  cx="76" cy="129" r="3.2" fill="#fff"/>
        </g>
        <g id="eyeR">
          <ellipse class="sclera" cx="128" cy="132" rx="19" ry="22" fill="var(--white)"/>
          <circle  class="pupil"  cx="128" cy="134" r="9.5" fill="var(--ink)"/>
          <circle  class="spark"  cx="132" cy="129" r="3.2" fill="#fff"/>
        </g>
        <g id="lids">
          <rect id="lidL" x="51" y="108" width="42" height="48" rx="8" fill="url(#body)" transform="scale(1,0)" transform-origin="72px 110px"/>
          <rect id="lidR" x="107" y="108" width="42" height="48" rx="8" fill="url(#body)" transform="scale(1,0)" transform-origin="128px 110px"/>
        </g>
        <ellipse id="cheekL" cx="52" cy="160" rx="13" ry="8" fill="#ff8fa8" opacity="0" filter="url(#soft)"/>
        <ellipse id="cheekR" cx="148" cy="160" rx="13" ry="8" fill="#ff8fa8" opacity="0" filter="url(#soft)"/>
        <ellipse id="mouth" cx="100" cy="172" rx="21" ry="3" fill="var(--ink)"/>
        <path    id="smile" d="M80 170 Q100 182 120 170" stroke="var(--ink)" stroke-width="5"
                 stroke-linecap="round" fill="none" opacity="1"/>
      </g>
    </g>
  </svg>
  <div id="caption"></div>
</section>

<div id="fault"></div>

<script type="module">
const $ = id => document.getElementById(id)
const qs = new URLSearchParams(location.search)
const DEMO = qs.get('demo') === '1'
const clamp = (v, a, b) => Math.min(b, Math.max(a, v))
const fault = msg => { const f = $('fault'); f.textContent = msg; f.style.display = msg ? 'block' : 'none' }

const show = which => {
  for (const s of ['arm', 'idle', 'live']) $(s).hidden = s !== which
}

/* ------------------------------------------------------------------ *
 * THE FACE
 *
 * One rAF loop owns every pixel. Each expressive channel is a spring -
 * a value chasing a target - which is what keeps it feeling alive
 * rather than mechanical. Nothing in nature steps to a new value.
 * ------------------------------------------------------------------ */
const face = {
  state: 'idle',
  openTarget: 0, open: 0,
  gaze: { x: 0, y: 0, tx: 0, ty: 0 },
  lid: 0, blinkAt: 0, blinking: 0,
  warmth: 0, warmthTarget: 0,
  wobble: 0,
}

function setState(s, caption) {
  face.state = s
  $('badge').textContent = { listening: 'listening', thinking: 'thinking', speaking: 'speaking' }[s] ?? ''
  if (caption !== undefined) $('caption').textContent = caption
  face.warmthTarget = (s === 'happy' || s === 'speaking') ? 1 : 0
}

// Eyes wander. Eyes that move only on command look dead; the bias toward
// centre keeps it reading as "looking at you" rather than away.
function wander() {
  face.gaze.tx = (Math.random() * 2 - 1) * 0.55
  face.gaze.ty = (Math.random() * 2 - 1) * 0.40
  setTimeout(wander, 900 + Math.random() * 1800)
}
wander()

let t0 = performance.now()
function frame(now) {
  const dt = Math.min(64, now - t0) / 1000
  t0 = now
  const k = x => 1 - Math.exp(-x * dt)        // frame-rate independent easing

  // mouth: fast attack, slow release. Symmetric timing chatters; a slow
  // release reads as a syllable trailing off.
  const target = face.state === 'speaking' ? face.openTarget : 0
  face.open += (target - face.open) * k(target > face.open ? 26 : 9)
  $('mouth').setAttribute('ry', (2.2 + face.open * 21).toFixed(2))
  $('mouth').setAttribute('rx', (21 + face.open * 5).toFixed(2))
  $('smile').setAttribute('opacity', clamp(1 - face.open * 3.2, 0, 1).toFixed(3))

  // eyes
  face.gaze.x += (face.gaze.tx - face.gaze.x) * k(5)
  face.gaze.y += (face.gaze.ty - face.gaze.y) * k(5)
  const dx = face.gaze.x * 6, dy = face.gaze.y * 4.5
  for (const [g, cx] of [['eyeL', 72], ['eyeR', 128]]) {
    const el = $(g)
    el.querySelector('.pupil').setAttribute('cx', (cx + dx).toFixed(2))
    el.querySelector('.pupil').setAttribute('cy', (134 + dy).toFixed(2))
    el.querySelector('.spark').setAttribute('cx', (cx + 4 + dx * .7).toFixed(2))
    el.querySelector('.spark').setAttribute('cy', (129 + dy * .7).toFixed(2))
  }
  const openEye = face.state === 'listening' ? 24 : 22   // widening = "I heard you"
  for (const g of ['eyeL', 'eyeR']) {
    const s = $(g).querySelector('.sclera')
    const cur = Number(s.getAttribute('ry'))
    s.setAttribute('ry', (cur + (openEye - cur) * k(6)).toFixed(2))
  }

  // blink
  if (now > face.blinkAt) { face.blinking = 1; face.blinkAt = now + 2200 + Math.random() * 3600 }
  if (face.blinking > 0) {
    face.lid = Math.sin(face.blinking * Math.PI)
    face.blinking = Math.max(0, face.blinking - dt * 7)
    if (face.blinking === 0) face.lid = 0
  }
  $('lidL').setAttribute('transform', `scale(1,${face.lid.toFixed(3)})`)
  $('lidR').setAttribute('transform', `scale(1,${face.lid.toFixed(3)})`)

  // cheeks
  face.warmth += (face.warmthTarget - face.warmth) * k(2.2)
  $('cheekL').setAttribute('opacity', (face.warmth * .55).toFixed(3))
  $('cheekR').setAttribute('opacity', (face.warmth * .55).toFixed(3))

  // body: a water drop is never perfectly still
  face.wobble += dt
  const sway = Math.sin(face.wobble * 1.5) * 1.2
  const bob  = Math.sin(face.wobble * 2.3) * 1.0 - face.open * 3.5
  $('drop').setAttribute('transform',
    `translate(${sway.toFixed(2)} ${bob.toFixed(2)}) rotate(${(sway * .35).toFixed(2)} 100 140)`)

  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)

/* The mouth is read off the assistant's actual audio. The SDK's volume-level
   event is kept as a fallback for whenever the track is not reachable. */
function attachAnalyser(stream) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)()
  const an = ctx.createAnalyser()
  an.fftSize = 512; an.smoothingTimeConstant = 0.45
  ctx.createMediaStreamSource(stream).connect(an)
  const buf = new Uint8Array(an.frequencyBinCount)
  const tick = () => {
    an.getByteTimeDomainData(buf)
    let peak = 0
    for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128))
    // /48 rather than /128: speech rarely nears full scale, and a mouth that
    // only twitches is worse than one that slightly over-acts.
    face.openTarget = clamp(peak / 48, 0, 1)
    requestAnimationFrame(tick)
  }
  tick()
}

/* ------------------------------------------------------------------ *
 * DEMO - no network, no microphone, no Vapi.
 * ------------------------------------------------------------------ */
if (DEMO) {
  show('live')
  const script = [
    [1200, 'listening', ''],
    [900,  'thinking',  ''],
    [4200, 'speaking',  'Oh, hello! Fancy a hot soak?'],
    [1400, 'listening', ''],
    [3600, 'speaking',  'Ten thermal pools, right under the mountains.'],
    [1200, 'happy',     'Come on, this way.'],
  ]
  let i = 0
  const run = () => { const [ms, st, cap] = script[i++ % script.length]; setState(st, cap); setTimeout(run, ms) }
  run()
  setInterval(() => {
    if (face.state !== 'speaking') return
    const t = performance.now() / 1000
    const syll = Math.max(0, Math.sin(t * 11)) * Math.max(0, Math.sin(t * 2.6))
    face.openTarget = clamp(syll * 1.25 + Math.random() * .12, 0, 1)
  }, 33)
}

/* ------------------------------------------------------------------ *
 * LIVE
 * ------------------------------------------------------------------ */
async function live() {
  let cfg
  try { cfg = await (await fetch('/api/config')).json() }
  catch (e) { return void fault(`cannot reach the server for config: ${e.message}`) }

  // QR. If the encoder will not load - no wifi, blocked CDN - the URL is
  // printed instead. A blank white square is the one failure nobody in the
  // room could diagnose.
  const joinUrl = qs.get('qr') || cfg.joinUrl
  try {
    const m = await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm')
    const canvas = document.createElement('canvas')
    await (m.default ?? m).toCanvas(canvas, joinUrl, { margin: 1, width: 900,
      color: { dark: '#04243aff', light: '#ffffffff' } })
    $('qr').replaceChildren(canvas)
  } catch { $('qr-fallback').textContent = joinUrl }

  const { default: Vapi } = await import('https://cdn.jsdelivr.net/npm/@vapi-ai/web@3.1.0/+esm')
  const vapi = new Vapi(cfg.publicKey)
  let calling = false, analyserOn = false

  vapi.on('call-start',   () => { calling = true; show('live'); setState('listening', ''); fault('') })
  vapi.on('speech-start', () => setState('speaking'))
  vapi.on('speech-end',   () => setState('listening', ''))
  vapi.on('volume-level', v => { if (!analyserOn) face.openTarget = clamp(v * 1.6, 0, 1) })
  vapi.on('message', m => {
    if (m?.type === 'transcript' && m.transcriptType === 'final' && m.role === 'assistant') {
      $('caption').textContent = m.transcript
    }
  })
  vapi.on('error', e => fault(`voice error: ${e?.message ?? e}`))
  vapi.on('call-end', () => { calling = false; analyserOn = false; setState('idle'); show('idle') })
  vapi.on('daily-participant-updated', p => {
    const track = p?.tracks?.audio?.persistentTrack
    if (!track || analyserOn) return
    try { attachAnalyser(new MediaStream([track])); analyserOn = true } catch { /* keep the fallback */ }
  })

  const start = async name => {
    if (calling) return
    calling = true                                   // claim it before awaiting, or two events race in two calls
    try {
      // The microphone is this device's own. Default audioSource, default
      // echo cancellation: mic and speaker on one device is the case AEC
      // handles well, which is the entire reason the audio lives here.
      await vapi.start(cfg.assistantId, name ? { variableValues: { name } } : undefined)
    } catch (e) { calling = false; fault(`could not start the call: ${e?.message ?? e}`) }
  }
  const stop = () => { try { vapi.stop() } catch {} calling = false; show('idle') }

  /* The guest's phone decides when a session begins, and this polls to find
     out. Server-Sent Events were the obvious choice and work perfectly on
     the LAN, but a Cloudflare quick tunnel buffers text/event-stream so
     completely that nothing arrives at all - so the Start button worked in
     testing and would have done nothing on the deployed URL. Polling cannot
     be broken by a proxy's opinion about long-lived responses, and the only
     latency-critical path here, the lip sync, never leaves this device. */
  let since = 0, failures = 0
  const apply = m => {
    if (m.type === 'start') start(m.name)
    else if (m.type === 'stop') stop()
    else if (m.type === 'state' && m.live && !calling) start(m.name)
    else if (m.type === 'say' && calling) {
      // Injected as the GUEST's turn, not as a line for the robot to read
      // out. That way the assistant decides what to say and which tool to
      // call, exactly as if the sentence had been spoken - so a tapped
      // button and a spoken request cannot drift apart in behaviour.
      vapi.send({
        type: 'add-message',
        message: { role: 'user', content: m.text },
        triggerResponseEnabled: true,
      })
    }
  }

  const poll = async () => {
    try {
      const r = await fetch(`/api/events?since=${since}`, { cache: 'no-store' })
      if (!r.ok) throw new Error(`HTTP ${r.status}`)
      const d = await r.json()
      since = d.seq ?? since
      for (const e of d.events ?? []) apply(e)
      // A session that is already running when this screen (re)loads - after
      // a phone sleeps, say - must be rejoined, not waited on.
      if (d.session?.live && !calling) start(d.session.name)
      if (!d.session?.live && calling) stop()
      if (failures) { failures = 0; fault('') }
    } catch (e) {
      // One dropped poll on a phone radio is normal; say so only once it is
      // a pattern, or the face cries wolf through every tunnel hiccup.
      if (++failures === 4) fault('lost the link to the server — retrying')
    } finally {
      setTimeout(poll, 700)
    }
  }
  poll()

  show('idle')
}

/* Arm once, by hand, at setup. After this tap the page may take the
   microphone and play sound for the rest of its life. */
if (!DEMO) {
  $('arm').addEventListener('click', async () => {
    try {
      // Ask for the microphone now rather than mid-demo, and release it
      // again immediately: we only want the permission, Vapi takes the
      // real stream later.
      const s = await navigator.mediaDevices.getUserMedia({ audio: true })
      s.getTracks().forEach(t => t.stop())
    } catch (e) {
      fault(`no microphone: ${e.message}. This page must be served over HTTPS for a phone to allow it.`)
    }
    try { await new (window.AudioContext || window.webkitAudioContext)().resume() } catch {}
    live()
  }, { once: true })
}
</script>
</body>
</html>
